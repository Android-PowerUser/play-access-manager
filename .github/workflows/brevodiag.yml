name: brevodiag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: diag
        env:
          K: ${{ secrets.BREVO_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          K=os.environ["K"]
          def get(path):
              req=urllib.request.Request("https://api.brevo.com/v3"+path, headers={"api-key":K,"accept":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
          st,d=get("/account")
          if st==200:
              print("::notice title=account::"+json.dumps({"email":d.get("email"),"plan":[ (p.get("type"),p.get("credits")) for p in d.get("plan",[])]})[:300])
          else:
              print("::error title=account::"+str(st)+" "+str(d))
          st,d=get("/senders")
          if st==200:
              print("::notice title=senders::"+json.dumps([(s.get("email"),s.get("active")) for s in d.get("senders",[])]))
          else:
              print("::error title=senders::"+str(st)+" "+str(d))
          st,d=get("/smtp/statistics/events?days=2&limit=50&sort=desc")
          if st==200:
              for e in d.get("events",[])[:12]:
                  print("::notice title=event::"+json.dumps({k:e.get(k) for k in ("date","email","event","from","tag","reason")}))
              if not d.get("events"): print("::notice title=event::keine Events")
          else:
              print("::error title=events::"+str(st)+" "+str(d))
          PY
