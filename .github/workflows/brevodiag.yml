name: brevodiag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: diag
        env:
          K: ${{ secrets.BREVO_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          K=os.environ["K"]
          req=urllib.request.Request("https://api.brevo.com/v3/smtp/statistics/events?days=1&limit=50&sort=desc&email=electroneum40%40gmail.com", headers={"api-key":K,"accept":"application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  d=json.load(r)
              for e in d.get("events",[])[:8]:
                  print("::notice title=event::"+json.dumps({k:e.get(k) for k in ("date","event","from","tag","reason")}))
          except urllib.error.HTTPError as e:
              print("::error title=events::"+str(e.code)+" "+e.read().decode()[:200])
          PY
