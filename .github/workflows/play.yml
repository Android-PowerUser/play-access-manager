name: play-access
on:
  workflow_dispatch:
    inputs:
      action:
        description: "users | user | grant | window | check | invite | request"
        required: true
        type: choice
        options: [users, user, grant, window, check, invite, strip, setglobal, request, migrate]
      email:
        description: "Nutzer-Gmail"
        required: false
      app:
        description: "Paketname (grant/window/request) oder bei migrate: apply"
        required: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - run: python assign.py "$ACTION" "$EMAIL" "$APP"
        env:
          ACTION: ${{ inputs.action }}
          EMAIL: ${{ inputs.email }}
          APP: ${{ inputs.app }}
          DEV_ID: "5200204185935193647"
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
