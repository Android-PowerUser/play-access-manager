name: sheet-poll
on:
  workflow_dispatch:
concurrency:
  group: sheet-poll
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - run: python sheet_poll.py
        env:
          DEV_ID: "5200204185935193647"
          SHEET_ID: "1SZ8MWGoQ-wUDR_hReqHwBVXA0xbW6ayetRp7rSfNgKg"
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      - name: Stand sichern
        run: |
          git config user.name "play-bot"
          git config user.email "play-bot@users.noreply.github.com"
          git add sheet_state.json
          git diff --cached --quiet || (git commit -m "sheet state" && git push)
